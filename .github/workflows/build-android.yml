name: Publish Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: '29.0.13113456'
  ANDROID_VERSION_CODE_BASE_EPOCH: '1704067200'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Git LFS filters
        run: git lfs install

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}'
          log-accepted-android-sdk-licenses: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve and verify dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/verify_simple_torrent_artifacts.dart

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not set"
              exit 1
            fi
          done

      - name: Compute Android version code
        id: version
        run: |
          now_utc_seconds=$(date -u +%s)
          build_number=$((now_utc_seconds - ANDROID_VERSION_CODE_BASE_EPOCH))
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'storeFile=upload-keystore.jks' > android/key.properties

      # This is an intentional production artifact: do not add the safe-torrent
      # development define to this command.
      - name: Build signed release APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.build_number }}
        # Do not use --no-pub here: Flutter must refresh the release plugin
        # registrant so dev-only integration_test code is excluded.
        run: flutter build apk --release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ steps.version.outputs.build_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          build/app/outputs/flutter-apk/app-release.apk#tamashii-${{ github.event.release.tag_name }}.apk
          --clobber
