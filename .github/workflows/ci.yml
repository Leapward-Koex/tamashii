name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep prereleases in FIFO order so an older run cannot publish last.
  queue: max

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '29.0.13113456'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Git LFS filters
        run: git lfs install

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}'
          log-accepted-android-sdk-licenses: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify bundled torrent binaries
        run: dart run tool/verify_simple_torrent_artifacts.dart

      - name: Verify generated sources
        run: |
          dart run build_runner build --delete-conflicting-outputs
          generated_status="$RUNNER_TEMP/generated-sources-status.txt"
          git status --short --untracked-files=all -- \
            ':(glob)**/*.g.dart' \
            ':(glob)**/*.freezed.dart' > "$generated_status"
          if test -s "$generated_status"; then
            echo 'Generated Dart sources are not up to date:' >&2
            cat "$generated_status" >&2
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Analyze and test Android network-cost plugin
        working-directory: plugins/tamashii_network_cost
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test Android network-cost adapter
        working-directory: android
        # Bash does not depend on the checkout preserving gradlew's executable bit.
        run: bash ./gradlew :tamashii_network_cost:testDebugUnitTest

  android-smoke:
    name: Android ${{ matrix.mode }} build
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install Git LFS filters
        run: git lfs install

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}'
          log-accepted-android-sdk-licenses: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve and verify dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/verify_simple_torrent_artifacts.dart

      - name: Validate prerelease signing secrets
        if: matrix.mode == 'release' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not set"
              exit 1
            fi
          done

      - name: Restore prerelease signing key
        if: matrix.mode == 'release' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'storeFile=upload-keystore.jks' > android/key.properties

      - name: Create pull-request signing key
        if: matrix.mode == 'release' && github.ref != 'refs/heads/main'
        run: |
          keytool -genkeypair -keystore android/smoke-upload-keystore.jks -storepass tamashii-smoke -keypass tamashii-smoke -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Tamashii CI"
          printf '%s\n' \
            'storePassword=tamashii-smoke' \
            'keyPassword=tamashii-smoke' \
            'keyAlias=smoke' \
            'storeFile=smoke-upload-keystore.jks' > android/key.properties

      - name: Build Android
        # Flutter must refresh its build-mode-specific Android plugin registrant;
        # --no-pub can leave the dev-only integration_test plugin in release builds.
        # CI artifacts intentionally retain the production torrent configuration.
        run: flutter build apk --${{ matrix.mode }}

      - name: Upload debug APK
        if: matrix.mode == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Android prerelease asset
        if: matrix.mode == 'release'
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/tamashii-android.apk

      - name: Upload release APK
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/tamashii-android.apk
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Windows ${{ matrix.mode }} build
    needs: quality
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Install Git LFS filters
        run: git lfs install

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Resolve and verify dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/verify_simple_torrent_artifacts.dart

      - name: Build Windows
        # Keep pub enabled so Flutter refreshes build-mode-specific plugin registrants.
        # CI artifacts intentionally retain the production torrent configuration.
        run: flutter build windows --${{ matrix.mode }}

      - name: Upload debug Windows bundle
        if: matrix.mode == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: windows-debug
          path: build/windows/x64/runner/debug/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Windows prerelease asset
        if: matrix.mode == 'release'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/release/*' -DestinationPath 'dist/tamashii-windows.zip' -Force

      - name: Upload release Windows bundle
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/tamashii-windows.zip
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish prerelease
    if: github.ref == 'refs/heads/main'
    needs:
      - quality
      - android-smoke
      - windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        shell: bash
        run: |
          current_tag="prerelease-${GITHUB_RUN_NUMBER}"
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list 'prerelease-*' --sort=-version:refname |
              grep -Fvx "$current_tag" |
              head -n 1 || true
          )"

          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$GITHUB_SHA"
            comparison="Changes since [$previous_tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_SHA):"
          else
            commit_range="$GITHUB_SHA"
            comparison="Changes included in this first automated prerelease:"
          fi

          {
            printf 'Automated build of [`%s`](%s/%s/commit/%s).\n\n' "${GITHUB_SHA::7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '%s\n\n' "$comparison"
            git log "$commit_range" --first-parent --pretty=format:'- %s (`%h`)'
            printf '\n\n### Artifacts\n\n- Signed Android release APK\n- Windows release bundle\n'
          } > release-notes.md

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A rerun keeps its original SHA. Do not let an old rerun publish
          # after a newer main build has already become the branch head.
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping stale prerelease rerun for $GITHUB_SHA; main is $main_sha"
              exit 0
            fi
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if [[ ${#assets[@]} -ne 2 ]]; then
            echo "::error::Expected two prerelease assets, found ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          tag="prerelease-${GITHUB_RUN_NUMBER}"
          title="Tamashii prerelease $short_sha"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --prerelease \
              --title "$title" \
              --notes-file release-notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md
          fi
